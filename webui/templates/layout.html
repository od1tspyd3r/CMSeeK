<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "CMSeeK Web UI" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <div class="brand">
          <a href="{{ url_for('index') }}">CMSeeK Web UI</a>
          <span class="sub">Scan history + diffs</span>
        </div>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}

  </body>
</html>
